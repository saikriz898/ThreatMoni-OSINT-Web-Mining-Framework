[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatmoni"
version = "1.0.0"
description = "OSINT Web Mining Framework for Threat Horizon Scanning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sai Krishnan S", email = "[EMAIL_ADDRESS]"}
]
keywords = ["cybersecurity", "osint", "threat-intelligence", "machine-learning", "horizon-scanning"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "streamlit>=1.25.0",
    "nltk>=3.8.0",
    "scipy>=1.10.0",
    "xgboost>=1.7.0",
    "tabulate>=0.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
